name: skypulse
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skypulse
      POSTGRES_USER: skypulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skypulse -d skypulse"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: database
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${WEB_PORT:-8080}}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      AVIATION_SCOPE: ${AVIATION_SCOPE:-worldwide}
      AVIATION_CACHE_TTL_SECONDS: ${AVIATION_CACHE_TTL_SECONDS:-120}
      AVIATION_API_BASE_URL: ${AVIATION_API_BASE_URL:-https://opensky-network.org/api}
      OPENSKY_TOKEN_URL: ${OPENSKY_TOKEN_URL:-https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
    depends_on:
      database:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
